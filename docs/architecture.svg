<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="62" text-anchor="middle" font-size="38" font-weight="700" fill="#0f172a">MCC：人在手机上当审稿人，AI 在服务器上当执行者</text>
  <text x="800" y="102" text-anchor="middle" font-size="22" fill="#64748b">中间是一条落库的消息总线 —— 合上电脑、换手机、断网重连，任务都不中断</text>

  <!-- 左：手机 -->
  <rect x="70" y="190" width="280" height="520" rx="40" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
  <rect x="140" y="208" width="140" height="10" rx="5" fill="#cbd5e1"/>
  <text x="210" y="262" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">手机 / 平板 / 电脑</text>
  <text x="210" y="294" text-anchor="middle" font-size="19" fill="#64748b">浏览器打开，可装到桌面</text>
  <rect x="100" y="320" width="220" height="120" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="210" y="362" text-anchor="middle" font-size="22" font-weight="700" fill="#075985">① 看进度 · 派活</text>
  <text x="210" y="396" text-anchor="middle" font-size="18" fill="#0369a1">多个 AI 终端并行</text>
  <text x="210" y="422" text-anchor="middle" font-size="18" fill="#0369a1">实时流式输出</text>
  <rect x="100" y="465" width="220" height="200" rx="14" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="210" y="507" text-anchor="middle" font-size="22" font-weight="700" fill="#5b21b6">② 审阅批注</text>
  <text x="210" y="541" text-anchor="middle" font-size="18" fill="#6d28d9">在原文上划选一段</text>
  <text x="210" y="567" text-anchor="middle" font-size="18" fill="#6d28d9">写批注，一键提交</text>
  <text x="210" y="601" text-anchor="middle" font-size="16" fill="#7c3aed">md · pdf · docx · 图片</text>
  <text x="210" y="625" text-anchor="middle" font-size="16" fill="#7c3aed">公式 · 流程图 · 音视频</text>

  <!-- 连接 -->
  <line x1="355" y1="380" x2="505" y2="380" stroke="#475569" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="430" y="358" text-anchor="middle" font-size="16" fill="#475569">HTTPS</text><text x="430" y="340" text-anchor="middle" font-size="16" fill="#475569">WebSocket</text>
  <text x="430" y="408" text-anchor="middle" font-size="15" fill="#94a3b8">密码登录 · 断线补发</text>

  <!-- 中：服务器 -->
  <rect x="510" y="160" width="700" height="600" rx="22" fill="#f8fafc" stroke="#334155" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="860" y="198" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">你的服务器（Node，一条命令起）</text>

  <rect x="545" y="225" width="630" height="70" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="860" y="268" text-anchor="middle" font-size="21" fill="#0f172a">网页服务 · 登录 · 实时推送</text>

  <rect x="545" y="325" width="630" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="860" y="362" text-anchor="middle" font-size="23" font-weight="700" fill="#92400e">消息总线（SQLite，每条消息落库）</text>
  <text x="860" y="395" text-anchor="middle" font-size="17" fill="#b45309">人发的、AI 回的、批注回投的，全在这里 —— 关掉页面也不丢</text>

  <rect x="545" y="445" width="300" height="160" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="695" y="485" text-anchor="middle" font-size="22" font-weight="700" fill="#065f46">终端池</text>
  <text x="695" y="520" text-anchor="middle" font-size="17" fill="#047857">Claude Code 子进程 × N</text>
  <text x="695" y="548" text-anchor="middle" font-size="17" fill="#047857">慢聊（DeepSeek 等）</text>
  <text x="695" y="580" text-anchor="middle" font-size="15" fill="#10b981">key 一律自备、走环境变量</text>

  <rect x="875" y="445" width="300" height="160" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1025" y="485" text-anchor="middle" font-size="22" font-weight="700" fill="#5b21b6">审阅系统</text>
  <text x="1025" y="520" text-anchor="middle" font-size="17" fill="#6d28d9">识别 [SHARE:文件] 标记</text>
  <text x="1025" y="548" text-anchor="middle" font-size="17" fill="#6d28d9">生成审阅卡 · 存批注</text>
  <text x="1025" y="576" text-anchor="middle" font-size="17" fill="#6d28d9">批注拼成清单回投终端</text>

  <line x1="860" y1="295" x2="860" y2="322" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <line x1="695" y1="415" x2="695" y2="445" stroke="#475569" stroke-width="4"/>
  <line x1="1025" y1="415" x2="1025" y2="445" stroke="#475569" stroke-width="4"/>

  <rect x="545" y="640" width="630" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="860" y="678" text-anchor="middle" font-size="21" fill="#0f172a">工作区文件夹</text>
  <text x="860" y="708" text-anchor="middle" font-size="17" fill="#64748b">AI 在这里写代码、出报告、做 PPT —— 跑在服务器上，不占你的电脑</text>
  <line x1="695" y1="608" x2="695" y2="637" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <text x="712" y="629" font-size="15" fill="#64748b">读写 · 跑命令</text>

  <!-- 右：审阅闭环 -->
  <rect x="1250" y="190" width="300" height="520" rx="22" fill="#faf5ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="1400" y="232" text-anchor="middle" font-size="24" font-weight="700" fill="#5b21b6">审阅闭环</text>
  <g font-size="19" fill="#3b0764">
    <circle cx="1290" cy="282" r="18" fill="#7c3aed"/><text x="1290" y="289" text-anchor="middle" fill="#fff" font-weight="700">1</text>
    <text x="1320" y="276">AI 交付文件</text><text x="1320" y="300" font-size="15" fill="#6b21a8">回复里写 [SHARE:路径]</text>
    <circle cx="1290" cy="382" r="18" fill="#7c3aed"/><text x="1290" y="389" text-anchor="middle" fill="#fff" font-weight="700">2</text>
    <text x="1320" y="376">手机弹出审阅卡</text><text x="1320" y="400" font-size="15" fill="#6b21a8">点开即看原文排版</text>
    <circle cx="1290" cy="482" r="18" fill="#7c3aed"/><text x="1290" y="489" text-anchor="middle" fill="#fff" font-weight="700">3</text>
    <text x="1320" y="476">逐段划选写批注</text><text x="1320" y="500" font-size="15" fill="#6b21a8">一键提交，回投原终端</text>
    <circle cx="1290" cy="582" r="18" fill="#7c3aed"/><text x="1290" y="589" text-anchor="middle" fill="#fff" font-weight="700">4</text>
    <text x="1320" y="576">AI 逐条修改</text><text x="1320" y="600" font-size="15" fill="#6b21a8">改完重新交付同一文件</text>
  </g>
  <path d="M1290,302 L1290,362" stroke="#7c3aed" stroke-width="3" marker-end="url(#p)"/>
  <path d="M1290,402 L1290,462" stroke="#7c3aed" stroke-width="3" marker-end="url(#p)"/>
  <path d="M1290,502 L1290,562" stroke="#7c3aed" stroke-width="3" marker-end="url(#p)"/>
  
  <text x="1400" y="668" text-anchor="middle" font-size="16" fill="#6b21a8">↺ 循环到满意为止</text>
  <line x1="1178" y1="525" x2="1247" y2="525" stroke="#7c3aed" stroke-width="3" marker-end="url(#p)"/>

  <text x="800" y="830" text-anchor="middle" font-size="20" fill="#475569">开源 · MIT · 自托管：自己的服务器、自己的 key、自己的数据</text>
</svg>
